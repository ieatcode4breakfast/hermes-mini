name: hermes-mini
version: 0.3.0
description: >-
  Hermes Mini — a mobile-first chat app for your Hermes agent. Multi-chat inbox, to-dos, bookmarks,
  search, scheduled jobs and skills, live narration, steering, approval mode, optional Web Push,
  dictation through Hermes' configured speech-to-text provider, and an optional bundled desktop
  viewer. Settings and data live outside the package.
author: Hermes Mini contributors
license: MIT
manifest_version: 2
kind: standalone
requires_hermes: ">=0.23.0"
provides_hooks:
  - pre_tool_call
  - pre_approval_request
  - on_human_input_request
  - post_llm_call
  - pre_llm_call
  - transform_tool_result
provides_tools: []
tags:
  - chat
  - web-app
  - pwa
  - notifications
  - mobile
python_dependencies: []
